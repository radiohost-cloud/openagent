<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#5b4fcf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d8ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Shine -->
  <rect width="512" height="256" rx="100" fill="url(#shine)"/>

  <!-- Diamond (based on logo.svg) -->
  <path d="M256 80 L128 192 L256 304 L384 192 Z" fill="url(#diamond)"/>

  <!-- Left face highlight -->
  <path d="M256 80 L128 192 L256 304 L256 400 Z" fill="white" opacity="0.15"/>

  <!-- Wave lines (based on logo.svg) -->
  <path d="M128 348 L256 468 L384 348" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M128 256 L256 376 L384 256" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45"/>
</svg>
