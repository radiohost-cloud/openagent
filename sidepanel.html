<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAgent</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">

      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <div id="headerCtx" class="header-ctx"></div>
        </div>
        <div class="header-actions">
          <button id="vaultBtn" class="header-btn" data-i18n-title="btnVault" title="Auto-save to Obsidian (off)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 12l10 5 10-5"/>
              <path d="M2 17l10 5 10-5" opacity="0.5"/>
            </svg>
          </button>
          <button id="screenshotBtn" class="header-btn" data-i18n-title="btnScreenshot" title="Take screenshot">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <button id="historyBtn" class="header-btn" data-i18n-title="btnHistory" title="Chat history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </button>
          <button id="collectBtn" class="header-btn" data-i18n-title="btnReadPage" title="Read this page">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </button>
          <button id="clearBtn" class="header-btn" data-i18n-title="btnClear" title="Clear conversation">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
          <button id="settingsBtn" class="header-btn" data-i18n-title="btnSettings" title="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="messages"></div>

      <!-- History panel (drawer) -->
      <div id="historyPanel" class="history-drawer hidden">
        <div class="history-drawer-header">
          <span data-i18n="historyTitle">Chat History</span>
          <button class="history-drawer-close" id="historyDrawerClose">&times;</button>
        </div>
        <div id="historyDrawerList" class="history-drawer-list"></div>
      </div>

      <!-- Status -->
      <div id="status" class="status hidden"></div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="input" placeholder="Message OpenAgent..." rows="1" spellcheck="false"></textarea>
          <button id="sendBtn" class="send-btn" title="Send">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" data-i18n="settingsTitle">Settings</span>
          <button id="closeSettings" class="header-btn">&times;</button>
        </div>
        <div class="modal-body">

          <!-- Theme + Language row -->
          <div class="settings-row">
            <div class="form-group form-group--sm">
              <label data-i18n="settingsBaseTheme">Base</label>
              <div class="toggle-group">
                <button id="themeDark" class="toggle-btn active" data-i18n="settingsThemeDark">Dark</button>
                <button id="themeLight" class="toggle-btn" data-i18n="settingsThemeLight">Light</button>
              </div>
            </div>
            <div class="form-group form-group--sm">
              <label data-i18n="settingsPreset">Preset</label>
              <select id="themePreset" class="settings-select">
                <option value="default">Default</option>
                <option value="dracula">Dracula</option>
                <option value="nord">Nord</option>
                <option value="monokai">Monokai</option>
                <option value="tokyo-night">Tokyo Night</option>
                <option value="catppuccin-mocha">Catppuccin Mocha</option>
                <option value="catppuccin-macchiato">Catppuccin Macchiato</option>
                <option value="catppuccin-frappe">Catppuccin Frappé</option>
                <option value="solarized-dark">Solarized Dark</option>
                <option value="gruvbox-dark">Gruvbox Dark</option>
                <option value="one-dark">One Dark</option>
                <option value="papercolor-dark">Papercolor Dark</option>
                <option value="papercolor-light">Papercolor Light</option>
                <option value="everforest">Everforest</option>
              </select>
            </div>
          </div>
          <div class="settings-row">
            <div class="form-group form-group--sm">
              <label data-i18n="settingsLanguage">Language</label>
              <select id="langSelect" class="settings-select">
                <option value="en">English</option>
                <option value="pl">Polski</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="ru">Русский</option>
              </select>
            </div>
            <div class="form-group form-group--sm">
              <label data-i18n="settingsFontSize">Font size</label>
              <select id="fontSizeSelect" class="settings-select">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="settingsApiKey">API Key</label>
            <input type="password" id="apiKeyInput" data-i18n-placeholder="settingsApiKeyPlaceholder" placeholder="sk-or-..." />
            <div class="form-links">
              <a href="https://openrouter.ai/keys" target="_blank" data-i18n="linkOpenrouterKeys">Get API key →</a>
            </div>
          </div>

          <div class="form-group">
            <label data-i18n="settingsCurrentModel">Current Model</label>
            <div id="currentModelDisplay" class="model-display">—</div>
          </div>

          <div class="form-group">
            <label data-i18n="settingsModelSearch">Model Search</label>
            <input type="text" id="modelSearch" data-i18n-placeholder="settingsModelSearchPlaceholder" placeholder="Filter models..." />
          </div>

          <div class="form-group">
            <label data-i18n="settingsModel">Model</label>
            <div id="modelList" class="model-list">
              <div class="model-loading" data-i18n="settingsLoading">Loading...</div>
            </div>
            <div id="modelHint" class="model-hint"></div>
          </div>

          <div class="form-group">
            <label data-i18n="settingsSystemPrompt">System Prompt</label>
            <textarea id="systemPromptInput" data-i18n-placeholder="settingsSystemPromptPlaceholder" rows="3" placeholder="Optional instructions..."></textarea>
          </div>

          <details class="vault-section">
            <summary class="vault-summary" data-i18n="settingsVaultTitle">Obsidian Vault</summary>
            <div class="vault-body">
              <div id="vaultSelectorPanel">
                <div class="vault-selector-row">
                  <div class="vault-selector-info">
                    <div id="vaultSelectedDisplay" class="vault-selected-display">
                      <span id="vaultSelectedName" class="vault-selected-name" data-i18n="settingsVaultNotSelected">No vault selected</span>
                      <span id="vaultSelectedPath" class="vault-selected-path"></span>
                    </div>
                  </div>
                  <div class="vault-selector-actions">
                    <button id="vaultSelectorBtn" class="vault-action-btn" data-i18n="settingsVaultSelect">Select vault</button>
                  </div>
                </div>
                <div id="vaultListContainer" class="vault-list-container hidden">
                  <div id="vaultList" class="vault-list"></div>
                </div>
              </div>
              <div class="vault-divider"></div>
              <div class="form-group">
                <label data-i18n="settingsVaultApiUrl">API URL</label>
                <input type="text" id="vaultApiUrlInput" class="settings-select" data-i18n-placeholder="settingsVaultApiUrlPlaceholder" placeholder="http://127.0.0.1:27124" />
              </div>
              <div class="form-group">
                <label data-i18n="settingsVaultApiToken">API Token</label>
                <input type="password" id="vaultApiTokenInput" class="settings-select" data-i18n-placeholder="settingsVaultApiTokenPlaceholder" placeholder="Token from Local REST API plugin" />
              </div>
              <div class="vault-api-actions">
                <button id="vaultApiTestBtn" data-i18n="settingsVaultApiTest">Test connection</button>
                <span id="vaultApiStatus" class="form-hint"></span>
              </div>
              <div class="form-hint" data-i18n="settingsVaultApiHint">Requires Local REST API plugin in Obsidian.</div>
            </div>
          </details>

          <div id="settingsStatus" class="settings-status"></div>
        </div>
        <div class="modal-footer">
          <button id="saveSettings" class="btn-save" data-i18n="btnSave">Save</button>
        </div>
      </div>
    </div>

    <script src="db.js"></script>
    <script src="memory.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
